# BD en memoria para tests: no toca la base real. Sin Flyway (Hibernate crea el esquema).
spring.datasource.url=jdbc:h2:mem:tutor-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Modelo/rate-limit para tests (no se llama de verdad al LLM).
anthropic.model=claude-opus-4-7
anthropic.max-tokens=1024
anthropic.timeout-seconds=30
tutor.rate-limit.capacidad=1000
tutor.rate-limit.minutos=1
