spring.application.name=tutor-socratico
# Perfil activo por defecto: desarrollo. En producción usar SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Modelo de IA (Anthropic). La clave NUNCA se versiona: se inyecta por entorno. ---
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-4-7}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:1024}
anthropic.max-tokens-extenso=${ANTHROPIC_MAX_TOKENS_EXTENSO:8192}
anthropic.timeout-seconds=${ANTHROPIC_TIMEOUT_SECONDS:30}

# --- JPA (común a todos los perfiles) ---
spring.jpa.open-in-view=false

# --- Integración LTI (valores por entorno) ---
lti.issuer=${LTI_ISSUER:}
lti.client-id=${LTI_CLIENT_ID:}
lti.jwks-uri=${LTI_JWKS_URI:}
lti.auth-login-url=${LTI_AUTH_LOGIN_URL:}

# --- Usuarios del login manual (fichero semilla y asignatura por defecto) ---
tutor.security.fichero=${TUTOR_USUARIOS_FICHERO:}
tutor.security.asignatura-por-defecto=${TUTOR_ASIGNATURA_POR_DEFECTO:General}

# --- Subida de archivos ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- Rate limiting de los endpoints que invocan al LLM ---
tutor.rate-limit.capacidad=${TUTOR_RATE_CAPACIDAD:20}
tutor.rate-limit.minutos=${TUTOR_RATE_MINUTOS:1}

# --- Correo (Gmail SMTP). Credenciales por entorno; nunca en el repositorio. ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Informe semanal del Radar Docente ---
informe.semanal.enabled=${INFORME_SEMANAL_ENABLED:true}
informe.semanal.remitente=${MAIL_FROM:${MAIL_USERNAME:}}
informe.semanal.cron=${INFORME_SEMANAL_CRON:0 0 8 * * *}
