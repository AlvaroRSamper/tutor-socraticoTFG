# ======================= PERFIL PROD (producción) =======================
# Toda la configuración sensible se inyecta por variables de entorno.

# Conexión PostgreSQL (parámetros compartidos por JPA y pgvector).
tutor.db.host=${DB_HOST}
tutor.db.port=${DB_PORT:5432}
tutor.db.name=${DB_NAME}
tutor.db.user=${DB_USER}
tutor.db.password=${DB_PASSWORD}

spring.datasource.url=jdbc:postgresql://${tutor.db.host}:${tutor.db.port}/${tutor.db.name}
spring.datasource.username=${tutor.db.user}
spring.datasource.password=${tutor.db.password}
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.h2.console.enabled=false

# pgvector: dimensión de los embeddings de AllMiniLmL6V2 = 384.
tutor.pgvector.table=${PGVECTOR_TABLE:embeddings}
tutor.pgvector.dimension=384

# Cookies de sesión endurecidas para HTTPS + embebido en iframe de Moodle (LTI).
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Detrás de un proxy inverso que termina TLS (nginx/traefik): honra X-Forwarded-* para
# detectar HTTPS correctamente (imprescindible para cookies Secure y el flujo LTI).
server.forward-headers-strategy=framework

# No exponer trazas de error al cliente.
server.error.include-message=never
server.error.include-stacktrace=never

# --- Login manual (mientras el Campus Virtual no dé acceso LTI) ---
# El profesor y el alumnado inician sesión con usuario/contraseña.
#
# 1) Cuentas puntuales (p. ej. el propio profesor) por variable de entorno:
#   TUTOR_SECURITY_USUARIOS_0_ID=99991
#   TUTOR_SECURITY_USUARIOS_0_PASSWORDHASH={bcrypt}$2a$10$....
#   TUTOR_SECURITY_USUARIOS_0_ROL=PROFESOR
#
# 2) Clase entera desde un fichero semilla CSV (id,contraseña,rol,asignatura):
#   TUTOR_USUARIOS_FICHERO=/ruta/al/usuarios.csv
#   TUTOR_ASIGNATURA_POR_DEFECTO=PROG1
# La contraseña puede ir en texto plano (se cifra con bcrypt al arrancar) o ya
# cifrada ({bcrypt}$2a$...). Genera el CSV con scripts/generar-usuarios.
# Restringe los permisos del fichero (contiene contraseñas) y bórralo tras repartirlas.
#
# El acceso LTI sigue configurado: rellena las variables LTI_* cuando esté disponible.
