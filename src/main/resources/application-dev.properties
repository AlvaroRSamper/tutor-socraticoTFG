# ======================= PERFIL DEV (desarrollo local, IntelliJ) =======================
# Objetivo: arrancar sin fricción. NO necesita Docker, ni PostgreSQL, ni API key para iniciar.
# Usa H2 en fichero y el almacén de vectores en memoria. Para producción, usar el perfil 'prod'.

# --- Base de datos: H2 en fichero (se crea sola en ./data al arrancar). Sin Flyway. ---
spring.datasource.url=jdbc:h2:file:./data/tutor
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.h2.console.enabled=true

# Cookies de sesión para desarrollo local sobre HTTP.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# --- Usuarios de desarrollo (texto plano, contraseña = usuario, SOLO local). ---
